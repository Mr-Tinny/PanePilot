name: Verify public PanePilot Portable 1.0.0.37
on:
  push:
    branches: ['publish/portable-1.0.0.37']
    paths: ['.github/workflows/publish-portable-1.0.0.37.yml']
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download the public ZIP and check the updater feed without signing in
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/Mr-Tinny/PanePilot/releases/download/portable-v1.0.0.37/PanePilot-1.0.0.37-Portable.zip -o PanePilot.zip
          echo 'bea684b0a14492d3de55d50fc0fae836ed663515da3c4aa9d26a45e9cdfefd7e  PanePilot.zip' | sha256sum --check
          unzip -tq PanePilot.zip
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 8 -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/Mr-Tinny/PanePilot/main/portable-version.txt -o feed.txt; then
              if [ "$(tr -d '\r\n' <feed.txt)" = '1.0.0.37' ]; then
                echo 'Public update feed verified: 1.0.0.37'
                exit 0
              fi
            fi
            sleep 12
          done
          exit 1
